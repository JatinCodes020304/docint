<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Document Intelligence</title>
    <!--
      Dashboard: a table of every processed document. Clicking a row opens
      that document's result page. Data comes from DocIntelAPI.getDocuments().
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/upload.html">
        <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
          <rect x="4" y="3" width="16" height="22" rx="2.5" fill="#1f4e46" />
          <path d="M20 8h4v14.5A2.5 2.5 0 0 1 21.5 25H20V8Z" fill="#173b35" />
          <path d="M20 3v5h5l-5-5Z" fill="#c5d4d0" />
          <rect x="8" y="11" width="8" height="1.5" rx="0.5" fill="#f4f3ef" />
          <rect x="8" y="15" width="8" height="1.5" rx="0.5" fill="#f4f3ef" />
          <rect x="8" y="19" width="5" height="1.5" rx="0.5" fill="#f4f3ef" />
        </svg>
        <span class="brand-text">Document Intelligence</span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="/upload.html">Upload</a>
        <a href="/dashboard.html" aria-current="page">Dashboard</a>
      </nav>
    </header>

    <main class="page">
      <header class="page-header">
        <div>
          <h1>Processed documents</h1>
          <p class="lede">
            Every file that has been through extraction and validation. Open a
            row to see extracted fields, line items, and checks.
          </p>
        </div>
        <a class="btn btn-primary" href="/upload.html">Upload another</a>
      </header>

      <section class="card">
        <div id="dashboard-root">
          <p class="empty">Loading documents…</p>
        </div>
      </section>
    </main>

    
    <script src="/static/js/api.js"></script>
    <script src="/static/js/dashboard.js"></script>
  </body>
</html>
